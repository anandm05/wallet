name: wallet

x-mem-note: &mem-note >
  Resource caps sized for a 1GB-RAM host running all four services
  together (postgres + redis + kafka + app share one t3.micro).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintech_ledger
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # shared_buffers/max_connections trimmed from Postgres defaults - see x-mem-note
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d fintech_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      # Single-node KRaft (combined broker+controller) - no Zookeeper
      # container, which alone saves ~200-400MB on this host.
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "Iz8EEKe3Qz2D7rpQbugzAw"
      KAFKA_PROCESS_ROLES: broker,controller
      # Client-facing listener requires SASL/PLAIN auth; CONTROLLER stays
      # plain (single-node Raft metadata traffic only, not client-facing).
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # Listener-scoped SASL config via KAFKA_LISTENER_NAME_*_JAAS_CONFIG
      # isn't reliably picked up by this image's env-to-properties
      # translation (listener names containing underscores, e.g.
      # SASL_PLAINTEXT, are ambiguous to it) - a real JAAS file via
      # java.security.auth.login.config, generated below from
      # KAFKA_PASSWORD at container start, is the reliable mechanism.
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?set KAFKA_PASSWORD in .env}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Kafka here is a short-lived relay to the balance-projection
      # consumer, not long-term storage - keep it from eating the 30GB disk.
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"
    # Generates the JAAS file KAFKA_OPTS points at from KAFKA_PASSWORD,
    # then hands off to the image's normal entrypoint script unchanged.
    # List form + printf (not a heredoc) - a heredoc's literal newlines
    # don't survive YAML's folded-scalar (>) collapsing into one line.
    entrypoint: ["/__cacert_entrypoint.sh"]
    command:
      - bash
      - -c
      - >-
        printf 'KafkaServer {\n  org.apache.kafka.common.security.plain.PlainLoginModule required\n
        username="%s"\n  password="%s"\n  user_app="%s";\n};\n' app "$$KAFKA_PASSWORD" "$$KAFKA_PASSWORD"
        > /tmp/kafka_server_jaas.conf && exec /etc/kafka/docker/run
    volumes:
      - kafkadata:/var/lib/kafka/data
    mem_limit: 450m
    healthcheck:
      # Alpine's default /bin/sh has no /dev/tcp - use nc instead.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: wallet/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fintech_ledger
      DB_USERNAME: wallet_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?set KAFKA_PASSWORD in .env}
      # Fixed heap instead of the Dockerfile's MaxRAMPercentage default -
      # that default reasons about the whole container's view of host
      # memory, which is wrong once postgres/redis/kafka are also
      # claiming RAM on the same 1GB box.
      JAVA_OPTS: "-Xmx384m -XX:+UseSerialGC"
    ports:
      - "8080:8080"
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
