name: UI demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # No Cognito settings here, so the published site offers demo mode only.
      - name: Build
        working-directory: ui
        run: npm ci && npm run build
        env:
          BASE: /wallet/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist
      - id: deployment
        uses: actions/deploy-pages@v4
